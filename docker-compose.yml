name: ofertas-bot

services:
  bot:
    build: .
    container_name: ofertas-bot
    restart: unless-stopped   # levanta sempre, também depois de um reboot do servidor
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/data/heartbeat')<120 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
